services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inkuo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a strong random value}
      POSTGRES_DB: inkuo_cloud
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkuo -d inkuo_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=inkuo_cloud;Username=inkuo;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a strong random value}
      DataProtection__KeyDir: /var/lib/inkuo/dp-keys
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set; generate with `openssl rand -base64 48`}
      Jwt__Issuer: inkuo-cloud
      Jwt__Audience: inkuo-desktop
      Jwt__AccessExpiryMinutes: 15
      Jwt__RefreshExpiryDays: 30
    volumes:
      - dpkeys:/var/lib/inkuo/dp-keys
    ports:
      - "8080:8080"

  billing:
    build:
      context: .
      dockerfile: Dockerfile
      target: billing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=inkuo_cloud;Username=inkuo;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a strong random value}
      Admin__Token: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set; generate with `openssl rand -base64 32`}
    ports:
      - "127.0.0.1:8081:8081"

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8082
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=inkuo_cloud;Username=inkuo;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a strong random value}
      DataProtection__KeyDir: /var/lib/inkuo/dp-keys
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set; generate with `openssl rand -base64 48`}
      Jwt__Issuer: inkuo-cloud
      Jwt__AdminAudience: inkuo-admin
      Admin__SeedUsername: ${ADMIN_SEED_USERNAME:?ADMIN_SEED_USERNAME must be set}
      Admin__SeedPassword: ${ADMIN_SEED_PASSWORD:?ADMIN_SEED_PASSWORD must be set and at least 12 chars}
      Releases__StorageDir: /var/lib/inkuo/releases
    volumes:
      - dpkeys:/var/lib/inkuo/dp-keys
      - releases-data:/var/lib/inkuo/releases
    ports:
      - "8082:8082"

volumes:
  pgdata:
  dpkeys:
  releases-data:
