[package]
name = "inkuo"
version = "0.1.0"
description = "AI Document Editor"
authors = ["inkuo team"]
edition = "2021"

[lib]
name = "inkuo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
anyhow = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
pdf-extract = "0.7"
similar = "2"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html", "serde"] }
once_cell = "1"
parking_lot = "0.12"
glob = "0.3"
notify = { version = "6", features = ["serde"] }
notify-debouncer-mini = "0.4"
tokio-util = "0.7.18"
calamine = "0.26"
quick-xml = "0.37"
zip = "2.2"
rust_xlsxwriter = "0.95"
walkdir = "2"
regex = "1"
fastembed = "5"
qdrant-edge = "0.7"
urlencoding = "2"
# Headless Mermaid renderer (parity-focused, targets Mermaid.js 11.15.0).
# Zero external deps: pure Rust + resvg for PNG. Replaces the previous
# npx + mmdc subprocess wrapper, which required Node and a Chromium
# download on first run. Re-exports a small facade crate; the
# `render` + `raster` features pull in layout + SVG + PNG pipelines.
merman = { version = "0.7", features = ["render", "raster"] }

# Lean release binary: smaller installer, faster cold start.
# - lto = "thin" gives most of the size/perf win of fat LTO with a much shorter
#   link time, which matters because we already link a heavy C++ stack
#   (fastembed/ort, merman/resvg, qdrant-edge).
# - codegen-units = 1 enables cross-module inlining that LTO can then fold.
# - panic = "abort" trims ~hundreds of KB of unwind tables.
# - strip = "symbols" keeps the .exe runnable while dropping PDB/debug info.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
