<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect width="1280" height="80" fill="#0f1a2e"/>
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">传统工作方式的痛点</text>
  <text x="50" y="140" font-family="Arial, sans-serif" font-size="18" fill="#555" font-style="italic">普通编辑器只能"打字 + 保存"，AI 聊天工具只能"聊"——二者是割裂的</text>
  <rect x="60" y="180" width="540" height="130" rx="8" fill="#f0f4f8" stroke="#d0d8e0" stroke-width="1"/>
  <text x="80" y="215" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a3a5c">✕ 传统编辑器</text>
  <text x="80" y="245" font-family="Arial, sans-serif" font-size="16" fill="#444">只能手动打字、排版、保存</text>
  <text x="80" y="270" font-family="Arial, sans-serif" font-size="16" fill="#444">格式调整繁琐，不支持 AI 协作</text>
  <text x="80" y="295" font-family="Arial, sans-serif" font-size="16" fill="#444">跨文件、跨格式操作困难</text>
  <rect x="650" y="180" width="540" height="130" rx="8" fill="#f0f4f8" stroke="#d0d8e0" stroke-width="1"/>
  <text x="670" y="215" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a3a5c">✕ AI 聊天工具</text>
  <text x="670" y="245" font-family="Arial, sans-serif" font-size="16" fill="#444">生成文本后需复制粘贴、格式全丢</text>
  <text x="670" y="270" font-family="Arial, sans-serif" font-size="16" fill="#444">没有工作区上下文</text>
  <text x="670" y="295" font-family="Arial, sans-serif" font-size="16" fill="#444">不能直接操作本地文件</text>
  <rect x="60" y="340" width="1130" height="90" rx="8" fill="#fff3e0" stroke="#ffb74d" stroke-width="1"/>
  <text x="80" y="375" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e65100">核心矛盾</text>
  <text x="80" y="405" font-family="Arial, sans-serif" font-size="16" fill="#bf360c">写一份 .docx 报告 → AI 生成文本 → 手动复制 → 粘贴到 Word → 重新排版 → 格式丢了 → 再调整……</text>
  <rect x="60" y="460" width="1130" height="80" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1"/>
  <text x="80" y="495" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">InkUO 的答案</text>
  <text x="80" y="520" font-family="Arial, sans-serif" font-size="16" fill="#1b5e20">把 AI Agent 真正"装进工作区"里，AI 直接读写你的 .docx / .xlsx / .pptx</text>
</svg>