<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect width="1280" height="80" fill="#0f1a2e"/>
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">云端服务（可选）</text>
  <rect x="60" y="120" width="1130" height="140" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="1"/>
  <text x="80" y="158" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#00695c">云端服务架构</text>
  <rect x="80" y="175" width="160" height="40" rx="8" fill="#00897b"/>
  <text x="160" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fff">InkUO Desktop</text>
  <line x1="240" y1="195" x2="280" y2="195" stroke="#999" stroke-width="2"/>
  <text x="285" y="199" font-family="Arial, sans-serif" font-size="11" fill="#999">HTTPS</text>
  <rect x="340" y="175" width="180" height="40" rx="8" fill="#1565c0"/>
  <text x="430" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fff">.NET 8 Minimal API</text>
  <line x1="520" y1="195" x2="560" y2="195" stroke="#999" stroke-width="2"/>
  <rect x="570" y="175" width="160" height="40" rx="8" fill="#2e7d32"/>
  <text x="650" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fff">PostgreSQL</text>
  <rect x="570" y="130" width="160" height="35" rx="8" fill="#e65100"/>
  <text x="650" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">JWT 认证</text>
  <rect x="570" y="220" width="160" height="35" rx="8" fill="#6a1b9a"/>
  <text x="650" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">兑换码计费</text>
  <rect x="60" y="290" width="550" height="190" rx="10" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="80" y="328" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f1a2e">云服务功能</text>
  <text x="80" y="362" font-family="Arial, sans-serif" font-size="15" fill="#444">● 账户注册 / 登录（JWT 认证）</text>
  <text x="80" y="392" font-family="Arial, sans-serif" font-size="15" fill="#444">● 统一模型代理（无需自行配置 API Key）</text>
  <text x="80" y="422" font-family="Arial, sans-serif" font-size="15" fill="#444">● 按 token 用量计费</text>
  <text x="80" y="452" font-family="Arial, sans-serif" font-size="15" fill="#444">● 兑换码充值系统</text>
  <text x="80" y="482" font-family="Arial, sans-serif" font-size="15" fill="#444">● 管理后台（运营 / 用户 / 订单 / 用量统计）</text>
  <rect x="640" y="290" width="550" height="190" rx="10" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="660" y="328" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f1a2e">本地 vs 云端对比</text>
  <rect x="660" y="345" width="120" height="28" rx="4" fill="#0f1a2e"/>
  <text x="720" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">维度</text>
  <rect x="790" y="345" width="110" height="28" rx="4" fill="#1565c0"/>
  <text x="845" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">本地</text>
  <rect x="910" y="345" width="110" height="28" rx="4" fill="#e65100"/>
  <text x="965" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">Cloud</text>
  <text x="670" y="403" font-family="Arial, sans-serif" font-size="13" fill="#444">网络</text>
  <text x="845" y="403" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1565c0">完全离线</text>
  <text x="965" y="403" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e65100">需联网</text>
  <text x="670" y="428" font-family="Arial, sans-serif" font-size="13" fill="#444">模型</text>
  <text x="845" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1565c0">用户自配</text>
  <text x="965" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e65100">官方统一</text>
  <text x="670" y="453" font-family="Arial, sans-serif" font-size="13" fill="#444">数据</text>
  <text x="845" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1565c0">全部本机</text>
  <text x="965" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e65100">认证信息</text>
  <text x="670" y="478" font-family="Arial, sans-serif" font-size="13" fill="#444">费用</text>
  <text x="845" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1565c0">免费</text>
  <text x="965" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e65100">按量付费</text>
  <rect x="60" y="510" width="550" height="170" rx="10" fill="#fff3e0" stroke="#ffb74d" stroke-width="1"/>
  <text x="80" y="548" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e65100">兑换码计费流程</text>
  <text x="80" y="580" font-family="Arial, sans-serif" font-size="15" fill="#bf360c">1. 用户购买兑换码</text>
  <text x="80" y="608" font-family="Arial, sans-serif" font-size="15" fill="#bf360c">2. 在 App 中输入兑换码</text>
  <text x="80" y="636" font-family="Arial, sans-serif" font-size="15" fill="#bf360c">3. 余额增加</text>
  <text x="80" y="664" font-family="Arial, sans-serif" font-size="15" fill="#bf360c">4. 使用中按 token 扣费</text>
  <rect x="640" y="510" width="550" height="170" rx="10" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1"/>
  <text x="660" y="548" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">管理后台（React + AntD）</text>
  <text x="660" y="580" font-family="Arial, sans-serif" font-size="15" fill="#1b5e20">● 用户管理</text>
  <text x="660" y="608" font-family="Arial, sans-serif" font-size="15" fill="#1b5e20">● 订单与兑换码管理</text>
  <text x="660" y="636" font-family="Arial, sans-serif" font-size="15" fill="#1b5e20">● 用量统计与报表</text>
  <text x="660" y="664" font-family="Arial, sans-serif" font-size="15" fill="#1b5e20">● 运营配置</text>
</svg>