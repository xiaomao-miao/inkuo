<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#3a7bd5"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg2)"/>
  <!-- Header line -->
  <rect x="80" y="60" width="60" height="4" rx="2" fill="url(#accent2)"/>
  <text x="80" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold" fill="#ffffff">产品概述</text>
  <line x1="80" y1="125" x2="500" y2="125" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Main content -->
  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#c0d0e8" line-height="1.8">
    <tspan x="80" dy="0">InkUO 是一款面向知识工作者、开发者和创意团队的</tspan>
    <tspan x="80" dy="32">AI 驱动文档编辑器桌面端。</tspan>
  </text>
  <!-- Feature cards -->
  <rect x="80" y="300" width="350" height="90" rx="8" fill="rgba(0,210,255,0.08)" stroke="rgba(0,210,255,0.2)" stroke-width="1"/>
  <text x="110" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#00d2ff">多格式支持</text>
  <text x="110" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8aa8c8">Markdown · Word · Excel · 代码 · PDF · SVG</text>
  
  <rect x="465" y="300" width="350" height="90" rx="8" fill="rgba(58,123,213,0.08)" stroke="rgba(58,123,213,0.2)" stroke-width="1"/>
  <text x="495" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#5a9be5">AI 智能体</text>
  <text x="495" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8aa8c8">Ask · Plan · Agent 三模式 AI 助手</text>

  <rect x="850" y="300" width="350" height="90" rx="8" fill="rgba(100,200,150,0.08)" stroke="rgba(100,200,150,0.2)" stroke-width="1"/>
  <text x="880" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#6cc8a0">桌面原生体验</text>
  <text x="880" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8aa8c8">Tauri 2 · 原生性能 · 跨平台</text>

  <!-- Bottom description -->
  <text x="80" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#7090b0" line-height="1.7">
    <tspan x="80" dy="0">无论你是撰写技术文档、编辑报告、处理数据表格，</tspan>
    <tspan x="80" dy="28">还是阅读论文，InkUO 都能通过 AI 无缝融入你的工作流。</tspan>
  </text>
</svg>