<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect width="1280" height="80" fill="#0f1a2e"/>
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">三种 AI 模式 —— 按需切换</text>
  <rect x="60" y="120" width="350" height="260" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="235" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#1565c0">❓</text>
  <text x="235" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0d47a1">Ask · 问答模式</text>
  <text x="80" y="250" font-family="Arial, sans-serif" font-size="15" fill="#444">
    <tspan x="235" dy="0" text-anchor="middle">快速提问 / 查阅知识库</tspan>
    <tspan x="235" dy="25" text-anchor="middle">解释代码 / 搜索文档</tspan>
    <tspan x="235" dy="25" text-anchor="middle">AI 只读，不修改任何文件</tspan>
  </text>
  <rect x="80" y="320" width="310" height="40" rx="6" fill="#1565c0"/>
  <text x="235" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">适合：快速查资料、了解上下文</text>
  <rect x="460" y="120" width="350" height="260" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="635" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#e65100">📋</text>
  <text x="635" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#bf360c">Plan · 规划模式</text>
  <text x="480" y="250" font-family="Arial, sans-serif" font-size="15" fill="#444">
    <tspan x="635" dy="0" text-anchor="middle">复杂需求 / 需要方案评审</tspan>
    <tspan x="635" dy="25" text-anchor="middle">AI 先出计划（步骤 + 文件列表</tspan>
    <tspan x="635" dy="25" text-anchor="middle">+ 工具链），用户确认后执行</tspan>
  </text>
  <rect x="480" y="320" width="310" height="40" rx="6" fill="#e65100"/>
  <text x="635" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">适合：需要评审的复杂任务</text>
  <rect x="860" y="120" width="350" height="260" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1035" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#2e7d32">⚡</text>
  <text x="1035" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1b5e20">Agent · 执行模式</text>
  <text x="880" y="250" font-family="Arial, sans-serif" font-size="15" fill="#444">
    <tspan x="1035" dy="0" text-anchor="middle">AI 直接动手干活</tspan>
    <tspan x="1035" dy="25" text-anchor="middle">完整读写权限</tspan>
    <tspan x="1035" dy="25" text-anchor="middle">22+ 工具 + 9 专家全可用</tspan>
    <tspan x="1035" dy="25" text-anchor="middle">最多 50 轮工具调用</tspan>
  </text>
  <rect x="880" y="320" width="310" height="40" rx="6" fill="#2e7d32"/>
  <text x="1035" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">适合：完全委托 AI 执行</text>
  <rect x="60" y="420" width="1130" height="260" rx="12" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f1a2e">模式对比</text>
  <rect x="80" y="480" width="180" height="50" rx="4" fill="#0f1a2e"/>
  <text x="170" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">维度</text>
  <rect x="270" y="480" width="180" height="50" rx="4" fill="#1565c0"/>
  <text x="360" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">Ask</text>
  <rect x="460" y="480" width="180" height="50" rx="4" fill="#e65100"/>
  <text x="550" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">Plan</text>
  <rect x="650" y="480" width="180" height="50" rx="4" fill="#2e7d32"/>
  <text x="740" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">Agent</text>
  <text x="80" y="550" font-family="Arial, sans-serif" font-size="15" fill="#444">文件修改</text>
  <text x="360" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#666">只读</text>
  <text x="550" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#666">确认后执行</text>
  <text x="740" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1b5e20">直接读写</text>
  <text x="80" y="580" font-family="Arial, sans-serif" font-size="15" fill="#444">工具调用</text>
  <text x="360" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#666">有限</text>
  <text x="550" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#666">规划 + 可选</text>
  <text x="740" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1b5e20">全部可用</text>
  <text x="80" y="610" font-family="Arial, sans-serif" font-size="15" fill="#444">适用场景</text>
  <text x="360" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#666">快速问答</text>
  <text x="550" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#666">方案评审</text>
  <text x="740" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1b5e20">全自动化</text>
  <text x="80" y="640" font-family="Arial, sans-serif" font-size="15" fill="#444">一键切换 →</text>
  <text x="360" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#666">⇄</text>
  <text x="550" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#666">⇄</text>
  <text x="740" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1b5e20">同一对话中无缝切换</text>
</svg>