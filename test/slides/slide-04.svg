<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect width="1280" height="80" fill="#0f1a2e"/>
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">核心亮点总览</text>
  <rect x="60" y="120" width="260" height="260" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
