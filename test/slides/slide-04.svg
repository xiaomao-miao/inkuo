  </text>
  <rect x="640" y="120" width="260" height="260" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="770" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" fill="#e65100">🧠</text>
  <text x="770" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#bf360c">本地 RAG</text>
  <text x="660" y="280" font-family="Arial, sans-serif" font-size="14" fill="#444">
