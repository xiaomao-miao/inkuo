  <text x="190" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0d47a1">AI 原生文档</text>
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="14" fill="#444" text-anchor="middle">
