  </text>
  <rect x="60" y="420" width="1130" height="260" rx="12" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f1a2e">更多亮点</text>
  <text x="80" y="500" font-family="Arial, sans-serif" font-size="18" fill="#444">● 三种 AI 模式：Ask 问答 / Plan 规划 / Agent 执行，一键切换</text>
  <text x="80" y="535" font-family="Arial, sans-serif" font-size="18" fill="#444">● 工作区视图：文件树 + 搜索 + Git + 知识库 + 快照 + 扩展</text>
  <text x="80" y="570" font-family="Arial, sans-serif" font-size="18" fill="#444">● Mermaid 流程图渲染，支持 PNG/SVG/PDF 输出</text>
  <text x="80" y="605" font-family="Arial, sans-serif" font-size="18" fill="#444">● 可选云端服务：账户管理 + 统一 LLM 代理 + Token 计费</text>
