<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg6)"/>
  <text x="80" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold" fill="#ffffff">技术架构</text>
  <line x1="80" y1="125" x2="400" y2="125" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Stack layers -->
  <!-- Layer 1: Desktop shell -->
  <rect x="80" y="170" width="1120" height="70" rx="8" fill="rgba(0,210,255,0.08)" stroke="rgba(0,210,255,0.25)" stroke-width="1.5"/>
  <text x="110" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#00d2ff">桌面外壳</text>
  <text x="320" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">Tauri 2（Rust 后端）</text>
  <text x="580" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">WebView2 渲染引擎</text>
  <text x="840" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">原生文件系统 · 系统对话框 · 多窗口</text>

  <!-- Arrow -->
  <text x="640" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#404060" text-anchor="middle">▼</text>

  <!-- Layer 2: Frontend -->
  <rect x="80" y="275" width="1120" height="70" rx="8" fill="rgba(58,123,213,0.08)" stroke="rgba(58,123,213,0.25)" stroke-width="1.5"/>
  <text x="110" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#5a9be5">前端框架</text>
  <text x="320" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">React 19 + TypeScript</text>
  <text x="580" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">Vite 7 构建</text>
  <text x="840" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">Zustand 5 状态管理</text>

  <!-- Arrow -->
  <text x="640" y="367" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#404060" text-anchor="middle">▼</text>

  <!-- Layer 3: Editor cores -->
  <rect x="80" y="380" width="1120" height="70" rx="8" fill="rgba(100,200,150,0.08)" stroke="rgba(100,200,150,0.25)" stroke-width="1.5"/>
  <text x="110" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#6cc8a0">编辑器核心</text>
  <text x="320" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">ProseMirror（富文本）</text>
  <text x="580" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">CodeMirror（代码）</text>
  <text x="840" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">FortuneSheet（表格）</text>

  <!-- Arrow -->
  <text x="640" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#404060" text-anchor="middle">▼</text>

  <!-- Layer 4: AI & services -->
  <rect x="80" y="485" width="1120" height="70" rx="8" fill="rgba(200,150,80,0.08)" stroke="rgba(200,150,80,0.25)" stroke-width="1.5"/>
  <text x="110" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#c8a050">AI 引擎与服务</text>
  <text x="320" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">AI Agent 智能体系统</text>
  <text x="580" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">知识库（向量搜索）</text>
  <text x="840" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">inkuo Cloud 云服务</text>

  <!-- Arrow -->
  <text x="640" y="577" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#404060" text-anchor="middle">▼</text>

  <!-- Layer 5: Document processing -->
  <rect x="80" y="590" width="1120" height="70" rx="8" fill="rgba(200,80,120,0.08)" stroke="rgba(200,80,120,0.25)" stroke-width="1.5"/>
  <text x="110" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#c85078">文档解析引擎</text>
  <text x="320" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">docx-editor-core（Word）</text>
  <text x="580" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">xlsx（Excel）</text>
  <text x="840" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b0c4d8">pdfjs-dist（PDF）</text>
</svg>