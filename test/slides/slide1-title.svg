<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#3a7bd5"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="180" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>
  <circle cx="200" cy="600" r="120" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>
  <circle cx="640" cy="360" r="300" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <!-- Accent line -->
  <rect x="540" y="240" width="200" height="4" rx="2" fill="url(#accent)"/>
  <!-- Main title -->
  <text x="640" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">InkUO</text>
  <!-- Subtitle -->
  <text x="640" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a0b4d8" text-anchor="middle" letter-spacing="4">AI 文档编辑器</text>
  <!-- Tagline -->
  <text x="640" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#6c8eb0" text-anchor="middle">重新定义文档编辑方式</text>
  <!-- Bottom info -->
  <text x="640" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4a6a8a" text-anchor="middle">版本 0.1.0 ｜ 基于 Tauri 2 + React 19</text>
</svg>