<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">InkUO application icon</title>
  <desc id="desc">A white upright panel folding into a cyan forward ribbon on a dark rounded square.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3035"/>
      <stop offset="0.42" stop-color="#11171a"/>
      <stop offset="1" stop-color="#020708"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="88%" cy="86%" r="65%">
      <stop offset="0" stop-color="#00c8d1" stop-opacity="0.25"/>
      <stop offset="0.52" stop-color="#006a72" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.76"/>
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.68" stop-color="#23eef1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#55f5f6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="wing" x1="0.2" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#4ff5f4"/>
      <stop offset="0.45" stop-color="#19dbe3"/>
      <stop offset="1" stop-color="#02aebb"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007d89"/>
      <stop offset="0.55" stop-color="#009ca9"/>
      <stop offset="1" stop-color="#15c9d2"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#f8fafb"/>
      <stop offset="1" stop-color="#e9eef0"/>
    </linearGradient>
    <filter id="markShadow" x="-25%" y="-25%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g>
    <rect x="32" y="28" width="960" height="960" rx="212" fill="url(#tile)"/>
    <rect x="32" y="28" width="960" height="960" rx="212" fill="url(#tileGlow)"/>
    <rect x="35" y="31" width="954" height="954" rx="209" fill="none" stroke="url(#edge)" stroke-width="5"/>
  </g>

  <g filter="url(#markShadow)">
    <!-- Rear cyan ribbon -->
    <path d="M456 520
             L691 285
             C714 262 750 276 746 308
             L712 575
             C709 600 701 616 683 633
             L513 793
             C489 816 456 799 456 765
             Z"
          fill="url(#wing)"/>

    <!-- Folded inner edge -->
    <path d="M456 520
             L505 471
             L505 738
             C505 759 497 775 482 790
             L470 801
             C461 792 456 780 456 765
             Z"
          fill="url(#fold)"/>

    <!-- Front upright panel -->
    <path d="M305 275
             H435
             C460 275 480 295 480 320
             V740
             C480 765 460 785 435 785
             H305
             C280 785 260 765 260 740
             V320
             C260 295 280 275 305 275
             Z"
          fill="url(#panel)"/>
  </g>
</svg>
