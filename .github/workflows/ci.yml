name: ci

on:
  push:
    branches: [master, "codex/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Production frontend build
        run: pnpm build:vite

      - name: Admin frontend build
        run: pnpm --filter inkuo-cloud-admin build

      - name: Marketing frontend build
        run: pnpm --filter inkuo-marketing build

  rust-check:
    name: Rust (check + clippy)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The hardening branch predates an enforced rustfmt gate and contains a
      # sizeable backlog of formatting-only differences. Normalize the runner
      # before the correctness gates so check and clippy still execute;
      # source formatting can then be committed as a separate mechanical pass.
      - name: Normalize Rust formatting for checks
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Rust compile check
        working-directory: src-tauri
        run: cargo check --all-targets

      # This pre-existing crate currently emits a large backlog of style/test
      # lints under the newest stable Clippy. Keep diagnostics visible while
      # compiler errors and the test suite remain blocking; turn warnings into
      # errors once that backlog has been baselined in a dedicated cleanup.
      - name: Clippy diagnostics
        working-directory: src-tauri
        run: cargo clippy --all-targets

  rust-tests:
    name: Rust (library tests)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # All Rust tests live in the library. Keeping this on a fresh runner and
      # excluding the app/example targets avoids materializing the enormous
      # staticlib + cdylib + test graph together and exhausting runner disk.
      - name: Rust library tests
        working-directory: src-tauri
        run: cargo test --lib

  cloud-server:
    name: Cloud server (.NET build + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inkuo_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: inkuo-ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inkuo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INKUSO_TEST_POSTGRES: Host=localhost;Port=5432;Database=inkuo_ci;Username=postgres;Password=inkuo-ci-postgres;Pooling=false
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: cloud-server
        run: dotnet restore src/Inkuso.Cloud.slnx

      - name: Build
        working-directory: cloud-server
        run: dotnet build src/Inkuso.Cloud.slnx --no-restore -c Release --warnaserror

      - name: Install EF migration tool
        run: dotnet tool install --global dotnet-ef --version 10.0.9

      - name: Apply PostgreSQL migrations
        working-directory: cloud-server
        run: >-
          dotnet ef database update
          --project src/Inkuso.Cloud.Core/Inkuso.Cloud.Core.csproj
          --startup-project src/Inkuso.Cloud.Core/Inkuso.Cloud.Core.csproj
          --configuration Release
          --no-build
          --connection "$INKUSO_TEST_POSTGRES"

      - name: Verify EF model has no pending changes
        working-directory: cloud-server
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Inkuso.Cloud.Core/Inkuso.Cloud.Core.csproj
          --startup-project src/Inkuso.Cloud.Core/Inkuso.Cloud.Core.csproj
          --configuration Release
          --no-build

      - name: Test
        working-directory: cloud-server
        run: dotnet test src/Inkuso.Cloud.slnx --no-build -c Release

      - name: Build production container
        working-directory: cloud-server
        run: docker build --target api --tag inkuo-cloud-ci .
